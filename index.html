<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Rescue Horizon - Dashboard</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        /* ... (Gardez vos styles CSS actuels, ils sont bons) ... */
        .status-card { margin-top: 20px; }
        .service-box { padding: 12px; margin-bottom: 8px; background: #121420; border-left: 4px solid #5865F2; border-radius: 4px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <!-- (Gardez tout votre structure HTML actuelle) -->
    
    <!-- AJOUTEZ CE BLOC DANS VOTRE SECTION TABLEAU DE BORD (view-dashboard) -->
    <div id="view-dashboard" class="view-section active">
        <div class="update-box">
            <div class="update-title">🚀 État des Services (Temps Réel)</div>
            <div id="status-container" class="status-card">
                Chargement des statuts...
            </div>
        </div>
        <!-- ... reste de votre code dashboard ... -->
    </div>

    <script>
        const socket = io("https://webapi-jlzq.onrender.com");

        // --- NOUVEAU SCRIPT POUR RECEVOIR LES DONNÉES DU SERVER ---

        // 1. Réception du statut des services (Toutes les 10s via server.js)
        socket.on('statusUpdate', (services) => {
            const container = document.getElementById('status-container');
            container.innerHTML = ''; 
            
            services.forEach(service => {
                const color = service.status === 'up' ? '#23a55a' : '#f23f43';
                container.innerHTML += `
                    <div class="service-box" style="border-left-color: ${color}">
                        <span>${service.name}</span>
                        <span style="font-weight:bold; color: ${color}">
                            ${service.status === 'up' ? 'OPÉRATIONNEL' : 'HORS LIGNE'} (${service.ping}ms)
                        </span>
                    </div>
                `;
            });
        });

        // 2. Réception des annonces et crédits (Temps réel)
        socket.on('loadInitialData', (data) => {
            // Logique pour remplir vos champs existants
            document.getElementById("siteUpdateDisplay").innerText = data.announcement.text;
            // ... (Ajoutez ici vos autres fonctions de mise à jour d'UI)
        });

        socket.on('updateAnnounceBroadcast', (data) => {
            document.getElementById("siteUpdateDisplay").innerText = data.text;
        });

        // ... (Gardez vos fonctions 'enterSite', 'publishSiteUpdate' etc.)
    </script>
</body>
</html>
