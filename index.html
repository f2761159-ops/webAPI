<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Statut Discord - France</title>
    <!-- Chart.js pour les diagrammes -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f111a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            background-color: #1a1d2e;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid #2a2e45;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            font-size: 1.8rem;
            color: #5865F2;
            margin-bottom: 10px;
        }
        .badge-status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            background-color: rgba(35, 165, 90, 0.2);
            color: #23a55a;
            border: 1px solid #23a55a;
        }
        .refresh-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #121420;
            padding: 10px 18px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            color: #a0a5c0;
        }
        .timer-highlight {
            color: #5865F2;
            font-weight: bold;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
        .chart-card {
            background-color: #22263d;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #2e3352;
        }
        .chart-card h3 {
            font-size: 1.05rem;
            margin-bottom: 15px;
            color: #dcddde;
            text-align: center;
        }
        canvas {
            max-width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Statut en Temps Réel - Services Discord (France)</h1>
            <div id="statusBadge" class="badge-status">Connexion à l'API...</div>
        </div>

        <div class="refresh-bar">
            <span>Dernière mise à jour : <strong id="lastUpdate">--:--:--</strong></span>
            <span>Prochain rafraîchissement dans : <span id="timer" class="timer-highlight">20s</span></span>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>Disponibilité par Service (%)</h3>
                <canvas id="barChart"></canvas>
            </div>

            <div class="chart-card">
                <h3>Répartition Globale</h3>
                <canvas id="doughnutChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://webapi-jlzq.onrender.com/api/discord-status";
        const REFRESH_INTERVAL = 20; // Rafraîchissement automatique toutes les 20 secondes
        let countdown = REFRESH_INTERVAL;

        let barChartInstance = null;
        let doughnutChartInstance = null;

        async function fetchDiscordData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                const now = new Date();
                document.getElementById("lastUpdate").innerText = now.toLocaleTimeString("fr-FR");
                
                const badge = document.getElementById("statusBadge");
                if (data.status_indicator === "none") {
                    badge.innerText = "● Tous les services sont opérationnels";
                    badge.style.color = "#23a55a";
                    badge.style.backgroundColor = "rgba(35, 165, 90, 0.2)";
                    badge.style.borderColor = "#23a55a";
                } else {
                    badge.innerText = "● Incident ou perturbation : " + data.status_description;
                    badge.style.color = "#f23f43";
                    badge.style.backgroundColor = "rgba(242, 63, 67, 0.2)";
                    badge.style.borderColor = "#f23f43";
                }

                const components = data.components || [];
                const labels = [];
                const values = [];
                let operationalCount = 0;
                let issueCount = 0;

                components.forEach(item => {
                    labels.push(item.name);
                    const isOp = item.status === "operational";
                    values.push(isOp ? 100 : 0);

                    if (isOp) operationalCount++;
                    else issueCount++;
                });

                updateBarChart(labels, values);
                updateDoughnutChart(operationalCount, issueCount);

            } catch (err) {
                console.error("Erreur :", err);
                document.getElementById("statusBadge").innerText = "● Erreur de connexion à l'API";
                document.getElementById("statusBadge").style.color = "#f23f43";
            }
        }

        function updateBarChart(labels, dataValues) {
            const ctx = document.getElementById('barChart').getContext('2d');
            if (barChartInstance) barChartInstance.destroy();

            barChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Opérationnel (%)',
                        data: dataValues,
                        backgroundColor: '#5865F2',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true, max: 100, ticks: { color: '#a0a5c0' } },
                        x: { ticks: { color: '#a0a5c0', font: { size: 10 } } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function updateDoughnutChart(operational, issues) {
            const ctx = document.getElementById('doughnutChart').getContext('2d');
            if (doughnutChartInstance) doughnutChartInstance.destroy();

            doughnutChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Opérationnels', 'Incidents'],
                    datasets: [{
                        data: [operational, issues],
                        backgroundColor: ['#23a55a', '#f23f43'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#a0a5c0' } }
                    }
                }
            });
        }

        // Compte à rebours de 20 secondes
        setInterval(() => {
            countdown--;
            document.getElementById("timer").innerText = countdown + "s";
            if (countdown <= 0) {
                countdown = REFRESH_INTERVAL;
                fetchDiscordData();
            }
        }, 1000);

        fetchDiscordData();
    </script>
</body>
</html>
